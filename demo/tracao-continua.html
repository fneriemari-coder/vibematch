<title>Tração Contínua</title>

<style>
  /* ============================================================
     TRAÇÃO CONTÍNUA — protótipo de ecossistema de negócios
     Compromisso deliberado com um único mundo visual (escuro):
     é a identidade da plataforma, não uma omissão. Toda cor é
     pintada explicitamente para a página não pegar emprestado o
     fundo do hospedeiro em nenhum tema.
     ============================================================ */
  :root {
    --ink: #060E17;
    --painel: #0E2033;
    --painel-alto: #16334E;
    --linha: #1E4362;
    --linha-fraca: #14293D;
    --creme: #F2EFE7;
    --neutro: #8FA7BC;
    --neutro-fraco: #5E7890;
    --ouro: #C9A46B;
    --ouro-claro: #E3C48D;
    --verde: #4FA97E;
    --amarelo: #D8A73E;
    --vermelho: #C4584F;

    --fonte-display: Georgia, "Times New Roman", ui-serif, serif;
    --fonte-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --fonte-dado: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

    --raio: 10px;
    --gap: 18px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--creme);
    font-family: var(--fonte-ui);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { text-wrap: balance; margin: 0; }

  button { font-family: inherit; font-size: inherit; cursor: pointer; }
  button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--ouro);
    outline-offset: 2px;
  }

  /* ---------- Cabeçalho ---------- */
  .topo {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 22px;
    border-bottom: 1px solid var(--linha);
    background: var(--painel);
    flex-wrap: wrap;
  }
  .marca { display: flex; align-items: center; gap: 12px; }
  .marca h1 {
    font-family: var(--fonte-display);
    font-size: 21px;
    letter-spacing: 0.01em;
    font-weight: 400;
  }
  .marca .sub {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--neutro-fraco);
    display: block;
    margin-top: 1px;
  }
  .topo-acoes { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }

  .btn {
    background: transparent;
    color: var(--creme);
    border: 1px solid var(--linha);
    border-radius: 7px;
    padding: 8px 14px;
    transition: border-color .15s, background .15s, color .15s;
  }
  .btn:hover { border-color: var(--ouro); color: var(--ouro-claro); }
  .btn-ouro {
    background: var(--ouro);
    color: #14243A;
    border-color: var(--ouro);
    font-weight: 650;
  }
  .btn-ouro:hover { background: var(--ouro-claro); border-color: var(--ouro-claro); color: #14243A; }
  .btn-peq { padding: 6px 11px; font-size: 13px; }

  /* ---------- Estrutura ---------- */
  .palco {
    display: grid;
    grid-template-columns: 246px minmax(0, 1fr);
    gap: 0;
    min-height: calc(100vh - 62px);
  }

  .trilho {
    border-right: 1px solid var(--linha);
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--painel);
  }
  .trilho .rotulo {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--neutro-fraco);
    padding: 0 8px 8px;
  }
  .aba {
    display: grid;
    grid-template-columns: 26px 1fr;
    align-items: start;
    gap: 10px;
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 10px;
    color: var(--neutro);
    transition: background .15s, color .15s, border-color .15s;
  }
  .aba:hover { background: var(--linha-fraca); color: var(--creme); }
  .aba[aria-current="true"] {
    background: var(--painel-alto);
    border-color: var(--linha);
    color: var(--creme);
  }
  .aba .num {
    font-family: var(--fonte-dado);
    font-size: 12px;
    color: var(--ouro);
    padding-top: 2px;
  }
  /* display:block — sem isto os dois spans ficam na mesma linha e o título
     encosta na descrição sem separação nenhuma. */
  .aba .tit { display: block; font-weight: 600; font-size: 14px; line-height: 1.3; }
  .aba .des { display: block; font-size: 11.5px; color: var(--neutro-fraco); line-height: 1.35; margin-top: 3px; }
  .aba[aria-current="true"] .des { color: var(--neutro); }

  .conteudo { padding: 24px 26px 30px; min-width: 0; }

  .modulo { display: none; }
  .modulo.ativo { display: block; animation: entra .28s ease both; }
  @keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .cabecalho-modulo { margin-bottom: 20px; }
  .cabecalho-modulo .olho {
    font-family: var(--fonte-dado);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ouro);
  }
  .cabecalho-modulo h2 {
    font-family: var(--fonte-display);
    font-size: 27px;
    font-weight: 400;
    margin: 5px 0 7px;
  }
  .cabecalho-modulo p { color: var(--neutro); max-width: 68ch; margin: 0; }

  /* ---------- Peças ---------- */
  .cartao {
    background: var(--painel);
    border: 1px solid var(--linha);
    border-radius: var(--raio);
    padding: 16px 18px;
  }
  .grade { display: grid; gap: var(--gap); }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); }

  .selo {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 5px;
    border: 1px solid var(--linha);
    color: var(--neutro);
    background: var(--linha-fraca);
    white-space: nowrap;
  }
  .selo.tenho { border-color: rgba(79,169,126,.5); color: #8FD3B2; background: rgba(79,169,126,.1); }
  .selo.preciso { border-color: rgba(201,164,107,.5); color: var(--ouro-claro); background: rgba(201,164,107,.1); }
  .selo.casa { border-color: var(--ouro); color: #14243A; background: var(--ouro); font-weight: 700; }

  .num-tese {
    font-family: var(--fonte-display);
    font-size: 31px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .rotulo-peq {
    font-size: 10.5px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--neutro-fraco);
  }

  .barra-fundo {
    height: 6px;
    background: var(--linha-fraca);
    border-radius: 99px;
    overflow: hidden;
  }
  .barra-preenche { height: 100%; background: var(--ouro); border-radius: 99px; transition: width .5s ease; }
  .barra-preenche.risco { background: var(--vermelho); }
  .barra-preenche.atencao { background: var(--amarelo); }
  .barra-preenche.ok { background: var(--verde); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--linha-fraca); vertical-align: top; }
  th {
    font-size: 10.5px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--neutro-fraco);
    font-weight: 600;
  }
  td.n { font-family: var(--fonte-dado); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rolagem { overflow-x: auto; }

  select, input[type="text"], textarea {
    width: 100%;
    background: var(--ink);
    color: var(--creme);
    border: 1px solid var(--linha);
    border-radius: 7px;
    padding: 9px 11px;
    font-family: inherit;
    font-size: 14px;
  }
  textarea { resize: vertical; min-height: 84px; font-family: var(--fonte-dado); font-size: 13px; }
  label.campo { display: block; margin-bottom: 12px; }
  label.campo > span {
    display: block;
    font-size: 10.5px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--neutro-fraco);
    margin-bottom: 6px;
  }

  /* ---------- Console da IA ---------- */
  .console {
    position: sticky;
    bottom: 0;
    border-top: 1px solid var(--linha);
    background: #071120;
    grid-column: 1 / -1;
  }
  .console-topo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--linha-fraca);
  }
  .console-topo .rotulo-peq { color: var(--ouro); }
  .pulso {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--verde);
    animation: pulso 2s infinite;
  }
  @keyframes pulso { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .console-linhas {
    max-height: 168px;
    overflow-y: auto;
    padding: 10px 16px 14px;
    font-family: var(--fonte-dado);
    font-size: 12.5px;
    line-height: 1.65;
    display: flex;
    flex-direction: column-reverse;
  }
  .linha-log { animation: surge .3s ease both; color: var(--neutro); }
  @keyframes surge { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; transform: none; } }
  .linha-log .hora { color: #43607D; }
  .linha-log .tag { color: var(--ouro); }
  .linha-log b { color: var(--creme); font-weight: 600; }
  .linha-log.decisao { color: var(--creme); }
  .linha-log.calculo .val { color: var(--ouro-claro); }

  /* ---------- Deck de match ---------- */
  .deck { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); gap: var(--gap); align-items: start; }
  .perfil-topo { display: flex; gap: 14px; align-items: flex-start; }
  .avatar {
    width: 52px; height: 52px; flex: none;
    border-radius: 9px;
    display: grid; place-items: center;
    font-family: var(--fonte-display);
    font-size: 19px;
    color: var(--ouro-claro);
    background: var(--painel-alto);
    border: 1px solid var(--linha);
  }
  .componentes li {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 12px;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid var(--linha-fraca);
  }
  .componentes { list-style: none; padding: 0; margin: 0; }
  .componentes .desc { grid-column: 1 / -1; font-size: 11.5px; color: var(--neutro-fraco); }
  .componentes .peso { font-family: var(--fonte-dado); font-size: 12px; color: var(--neutro); }

  .lista-vazia { color: var(--neutro-fraco); font-style: italic; }

  .semaforo { display: inline-flex; align-items: center; gap: 7px; font-weight: 650; font-size: 13px; }
  .ponto { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .v-verde { color: #8FD3B2; } .v-verde .ponto { background: var(--verde); }
  .v-amarelo { color: #E8C87C; } .v-amarelo .ponto { background: var(--amarelo); }
  .v-vermelho { color: #E58C84; } .v-vermelho .ponto { background: var(--vermelho); }

  .doc {
    font-family: var(--fonte-dado);
    font-size: 12.5px;
    line-height: 1.7;
    white-space: pre-wrap;
    background: var(--ink);
    border: 1px solid var(--linha);
    border-radius: 8px;
    padding: 16px;
    max-height: 340px;
    overflow-y: auto;
    color: var(--neutro);
  }

  .trilha-item {
    display: grid;
    grid-template-columns: 30px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid var(--linha-fraca);
  }
  .trilha-item .pos {
    font-family: var(--fonte-dado);
    color: var(--ouro);
    font-size: 13px;
  }
  .subiu { color: var(--verde); font-size: 11.5px; font-family: var(--fonte-dado); }
  .desceu { color: var(--neutro-fraco); font-size: 11.5px; font-family: var(--fonte-dado); }

  /* ---------- Sala de Guerra Comercial ---------- */
  .guerra {
    position: fixed;
    inset: 0;
    background: rgba(3, 8, 14, .93);
    z-index: 50;
    display: none;
    overflow-y: auto;
    padding: 26px 18px 40px;
  }
  .guerra.aberta { display: block; animation: entraGuerra .35s ease both; }
  @keyframes entraGuerra { from { opacity: 0; } to { opacity: 1; } }

  .guerra-caixa {
    max-width: 1080px;
    margin: 0 auto;
    background: var(--painel);
    border: 1px solid var(--ouro);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 90px rgba(0, 0, 0, .6);
  }
  .guerra-faixa {
    background: linear-gradient(90deg, #10263C, #1B3E5C);
    padding: 20px 26px;
    border-bottom: 1px solid var(--ouro);
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .guerra-faixa .selo-topo {
    font-family: var(--fonte-dado);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ouro);
  }
  .guerra-corpo { padding: 24px 26px 28px; }
  .guerra-secao + .guerra-secao { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--linha-fraca); }

  .medidor { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .medidor svg { flex: none; }
  .contador {
    font-family: var(--fonte-display);
    font-size: 54px;
    line-height: 1;
    color: var(--ouro-claro);
    font-variant-numeric: tabular-nums;
  }

  .assinatura {
    border: 1px dashed var(--linha);
    border-radius: 9px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .assinatura.assinado { border-style: solid; border-color: var(--verde); background: rgba(79,169,126,.06); }
  .assinatura .hash {
    font-family: var(--fonte-dado);
    font-size: 11px;
    color: var(--neutro-fraco);
    word-break: break-all;
  }

  /* ---------- Anúncios patrocinados ---------- */
  .patrocinado {
    border-color: var(--ouro);
    background: linear-gradient(180deg, rgba(201,164,107,.07), transparent 60%);
  }
  .tarja-ads {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--fonte-dado);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ouro);
    border: 1px solid var(--ouro);
    border-radius: 4px;
    padding: 2px 7px;
  }
  .porque {
    font-family: var(--fonte-dado);
    font-size: 11.5px;
    color: var(--neutro-fraco);
    border-left: 2px solid var(--linha);
    padding-left: 10px;
    margin-top: 10px;
  }
  .porque b { color: var(--neutro); font-weight: 600; }

  @media (max-width: 900px) {
    .palco { grid-template-columns: 1fr; }
    .contador { font-size: 42px; }
    .trilho {
      flex-direction: row;
      overflow-x: auto;
      border-right: none;
      border-bottom: 1px solid var(--linha);
    }
    .trilho .rotulo { display: none; }
    .aba { min-width: 190px; }
    .deck { grid-template-columns: 1fr; }
    .conteudo { padding: 18px 16px 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>

<header class="topo">
  <div class="marca">
    <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="16" fill="none" stroke="#1E4362" stroke-width="1.4"/>
      <circle cx="31.3" cy="8.7" r="2.1" fill="#C9A46B"/>
      <circle cx="8.7" cy="8.7" r="2.1" fill="#C9A46B"/>
      <circle cx="31.3" cy="31.3" r="2.1" fill="#C9A46B"/>
      <circle cx="8.7" cy="31.3" r="2.1" fill="#C9A46B"/>
      <path d="M20 11 L27 20 L20 29 Z" fill="#E3C48D"/>
      <path d="M20 11 L13 20 L20 29 Z" fill="#C9A46B" opacity="0.62"/>
    </svg>
    <div>
      <h1>Tração Contínua</h1>
      <span class="sub">Protótipo operável · dados simulados em memória</span>
    </div>
  </div>
  <div class="topo-acoes">
    <button class="btn btn-peq" id="btn-reset">Reiniciar simulação</button>
    <button class="btn btn-ouro btn-peq" id="btn-roteiro">▶ Roteiro de pitch</button>
  </div>
</header>

<div class="palco">
  <nav class="trilho" id="trilho" aria-label="Módulos do ecossistema">
    <span class="rotulo">Percurso do pitch</span>
  </nav>

  <main class="conteudo">
    <section class="modulo ativo" id="m-populacao" aria-labelledby="t1"></section>
    <section class="modulo" id="m-match" aria-labelledby="t2"></section>
    <section class="modulo" id="m-feed" aria-labelledby="t3"></section>
    <section class="modulo" id="m-contratos" aria-labelledby="t4"></section>
    <section class="modulo" id="m-lxp" aria-labelledby="t5"></section>
  </main>

  <div class="guerra" id="guerra" role="dialog" aria-modal="true" aria-label="Sala de guerra comercial">
    <div class="guerra-caixa" id="guerra-caixa"></div>
  </div>

  <div class="console" aria-live="polite">
    <div class="console-topo">
      <span class="pulso" aria-hidden="true"></span>
      <span class="rotulo-peq">Console da IA — por que o sistema decidiu assim</span>
      <button class="btn btn-peq" id="btn-limpar" style="margin-left:auto">Limpar</button>
    </div>
    <div class="console-linhas" id="console-linhas"></div>
  </div>
</div>

<script>
/* ============================================================================
   1. VOCABULÁRIO CONTROLADO
   Competências são códigos, não texto livre. É isso que permite ao algoritmo
   cruzar "preciso" com "tenho" por interseção de conjuntos em vez de adivinhar
   por similaridade de string — a diferença entre um match explicável e um
   match que ninguém consegue defender na frente de um investidor.
   ========================================================================== */
const COMP = {
  CANAIS_TRACAO:      'Canais de tração',
  GROWTH_PLG:         'Growth / PLG',
  OUTBOUND_B2B:       'Outbound B2B',
  INSIDE_SALES:       'Inside sales',
  PRICING:            'Pricing',
  UNIT_ECONOMICS:     'Unit economics',
  MA_FUSOES:          'M&A e fusões',
  VALUATION:          'Valuation',
  CAPTACAO:           'Captação',
  GESTAO_CAIXA:       'Gestão de caixa',
  MARGEM:             'Margem de contribuição',
  SUPPLY:             'Supply chain',
  INDUSTRIA_40:       'Indústria 4.0',
  FRANQUIAS:          'Expansão por franquias',
  RETENCAO:           'Retenção e churn',
  CS_ENTERPRISE:      'CS enterprise',
  MARCA:              'Marca e posicionamento',
  MIDIA_PERFORMANCE:  'Mídia de performance',
  DADOS_BI:           'Dados e BI',
  PRODUTO:            'Produto e discovery',
  LIDERANCA:          'Cultura e liderança',
  SUCESSAO:           'Sucessão familiar',
  TRIBUTARIO:         'Estrutura tributária',
  INTERNACIONAL:      'Internacionalização',
  ECOMMERCE:          'Operação de e-commerce',
  TAKE_RATE:          'Take rate de marketplace',
};

const SETOR = {
  SAAS: 'SaaS B2B', INDUSTRIA: 'Indústria', VAREJO: 'Varejo', AGRO: 'Agronegócio',
  SAUDE: 'Saúde', LOGISTICA: 'Logística', CONSTRUCAO: 'Construção', EDTECH: 'Educação',
  ENERGIA: 'Energia', ALIMENTACAO: 'Alimentação', MODA: 'Moda D2C', MARKETPLACE: 'Marketplace',
  MENTORIA: 'Mentoria',
};

/* Setores adjacentes: onde a experiência transfere mesmo sem ser o mesmo ramo.
   Distância setorial não zera o match — insight de fora do ramo tem valor, só
   vale menos que quem já viveu o mesmo problema. */
const ADJACENTE = {
  SAAS:       ['EDTECH', 'MARKETPLACE', 'SAUDE'],
  INDUSTRIA:  ['AGRO', 'LOGISTICA', 'CONSTRUCAO', 'ENERGIA'],
  VAREJO:     ['MODA', 'ALIMENTACAO', 'MARKETPLACE'],
  AGRO:       ['INDUSTRIA', 'LOGISTICA'],
  SAUDE:      ['SAAS', 'EDTECH'],
  LOGISTICA:  ['INDUSTRIA', 'VAREJO', 'AGRO'],
  CONSTRUCAO: ['INDUSTRIA', 'ENERGIA'],
  EDTECH:     ['SAAS', 'SAUDE'],
  ENERGIA:    ['INDUSTRIA', 'CONSTRUCAO'],
  ALIMENTACAO:['VAREJO', 'AGRO'],
  MODA:       ['VAREJO', 'MARKETPLACE'],
  MARKETPLACE:['SAAS', 'VAREJO', 'MODA'],
  MENTORIA:   [],
};

const CIDADES = {
  'São Paulo':     { lat: -23.55, lng: -46.63 },
  'Joinville':     { lat: -26.30, lng: -48.85 },
  'Fortaleza':     { lat: -3.73,  lng: -38.52 },
  'Belo Horizonte':{ lat: -19.92, lng: -43.94 },
  'Curitiba':      { lat: -25.43, lng: -49.27 },
  'Recife':        { lat: -8.05,  lng: -34.88 },
  'Rondonópolis':  { lat: -16.47, lng: -54.63 },
  'Florianópolis': { lat: -27.59, lng: -48.55 },
  'Goiânia':       { lat: -16.68, lng: -49.25 },

/** Haversine — usada no cruzamento de geolocalização das mentorias híbridas. */
function distanciaKm(a, b) {
  const R = 6371;
  const rad = (g) => (g * Math.PI) / 180;
  const dLat = rad(b.lat - a.lat);
  const dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}

/** Um OKR está em risco quando o tempo consumido corre à frente da entrega. */
function riscoOkr(okr) {
  const janela = 90;
  const decorrido = (janela - okr.prazoDias) / janela;
  const defasagem = decorrido - okr.progresso / 100;
  if (defasagem > 0.28) return 'CRITICO';
  if (defasagem > 0.10) return 'ATRASADO';
  return 'NO_PRAZO';
}

/* ============================================================================
   5. ALGORITMO DE MATCH POR COMPLEMENTARIDADE
   Não é afinidade. São cinco componentes ponderados, cada um com uma razão
   de negócio por trás:

   45  COMPLEMENTARIDADE — que fração dos gargalos de A o B efetivamente cobre
   20  RECIPROCIDADE     — A devolve algo? relação de mão dupla dura mais
   20  ESCALA            — experiência transfere entre faturamentos próximos
   10  SETOR             — mesmo ramo vale mais, ramo distante não vale zero
    5  URGÊNCIA DE OKR   — bônus quando o gargalo está num OKR em risco
   ========================================================================== */
const PESOS = { complementaridade: 45, reciprocidade: 20, escala: 20, setor: 10, urgencia: 5 };

function interseccao(a, b) { return a.filter((x) => b.includes(x)); }

function fatorEscala(a, b) {
  // Mentor declara a faixa de faturamento que atende; fora dela o conselho
  // não transfere — quem escalou R$ 400M raramente ajuda quem fatura R$ 3M.
  if (b.escalaAtendida) {
    const [min, max] = b.escalaAtendida;
    if (a.faturamento >= min && a.faturamento <= max) return 1;
    const alvo = a.faturamento < min ? min : max;
    const dist = Math.abs(Math.log10(a.faturamento || 1) - Math.log10(alvo));
    return Math.max(0, 1 - dist / 1.2);
  }
  if (!a.faturamento || !b.faturamento) return 0.5;
  const dist = Math.abs(Math.log10(a.faturamento) - Math.log10(b.faturamento));
  return Math.max(0, 1 - dist / 1.5);
}

function fatorSetor(a, b) {
  if (b.setor === 'MENTORIA' || a.setor === 'MENTORIA') return 0.8;
  if (a.setor === b.setor) return 1;
  if ((ADJACENTE[a.setor] || []).includes(b.setor)) return 0.6;
  return 0.25;
}

function okrsEmRisco(u) {
  return (u.okrs || []).filter((o) => riscoOkr(o) !== 'NO_PRAZO');
}

function calcularMatch(a, b) {
  const cobertos = interseccao(a.preciso, b.tenho);
  const complementaridade = a.preciso.length ? cobertos.length / a.preciso.length : 0;

  const devolvidos = interseccao(b.preciso, a.tenho);
  const reciprocidade = b.preciso.length ? devolvidos.length / b.preciso.length : 0;

  const escala = fatorEscala(a, b);
  const setor = fatorSetor(a, b);

  const emRisco = okrsEmRisco(a);
  const compUrgentes = new Set(emRisco.flatMap((o) => OKR_COMPETENCIA[o.titulo] || []));
  const urgentesCobertos = cobertos.filter((c) => compUrgentes.has(c));
  const urgencia = compUrgentes.size ? Math.min(1, urgentesCobertos.length / Math.max(1, compUrgentes.size)) : 0;

  const total =
    complementaridade * PESOS.complementaridade +
    reciprocidade * PESOS.reciprocidade +
    escala * PESOS.escala +
    setor * PESOS.setor +
    urgencia * PESOS.urgencia;

  return {
    total: Math.round(total),
    cobertos, devolvidos, urgentesCobertos,
    componentes: [
      { chave: 'complementaridade', valor: complementaridade, peso: PESOS.complementaridade,
        rotulo: 'Complementaridade',
        desc: `${cobertos.length} de ${a.preciso.length} gargalos de ${a.nome.split(' ')[0]} são cobertos` },
      { chave: 'reciprocidade', valor: reciprocidade, peso: PESOS.reciprocidade,
        rotulo: 'Reciprocidade',
        desc: devolvidos.length ? `devolve ${devolvidos.map((c) => COMP[c]).join(', ')}` : 'relação de mão única' },
      { chave: 'escala', valor: escala, peso: PESOS.escala,
        rotulo: 'Proximidade de escala',
        desc: b.escalaAtendida
          ? `atende de ${brl(b.escalaAtendida[0])} a ${brl(b.escalaAtendida[1])}`
          : `${brl(a.faturamento)} contra ${brl(b.faturamento)}` },
      { chave: 'setor', valor: setor, peso: PESOS.setor,
        rotulo: 'Adjacência setorial',
        desc: a.setor === b.setor ? 'mesmo setor'
          : (ADJACENTE[a.setor] || []).includes(b.setor) ? 'setor adjacente'
          : b.setor === 'MENTORIA' ? 'mentoria transversal' : 'setor distante' },
      { chave: 'urgencia', valor: urgencia, peso: PESOS.urgencia,
        rotulo: 'Urgência de OKR',
        desc: urgentesCobertos.length
          ? `cobre ${urgentesCobertos.map((c) => COMP[c]).join(', ')} em OKR em risco`
          : 'nenhum OKR em risco atendido' },
    ],
  };
}

function ranquear(a, universo = USUARIOS) {
  return universo
    .filter((b) => b.id !== a.id)
    .map((b) => ({ alvo: b, match: calcularMatch(a, b) }))
    .sort((x, y) => y.match.total - x.match.total);
}

/* ============================================================================
   5b. VALOR DESTRAVADO E SINERGIA OPERACIONAL
   O número grande da Sala de Guerra não pode ser inventado — é a primeira
   coisa que um investidor vai querer abrir. Cada competência coberta carrega
   uma fração do faturamento que ela historicamente destrava, ponderada pelo
   risco do OKR que a exige e pela probabilidade de o deal sair, que vem da
   própria nota do match.
   ========================================================================== */
const IMPACTO_COMPETENCIA = {
  CANAIS_TRACAO: 0.14, GROWTH_PLG: 0.12, OUTBOUND_B2B: 0.11, INSIDE_SALES: 0.08,
  PRICING: 0.06, UNIT_ECONOMICS: 0.05, MARGEM: 0.045,
  MA_FUSOES: 0.18, VALUATION: 0.09, CAPTACAO: 0.15,
  GESTAO_CAIXA: 0.035, SUPPLY: 0.04, INDUSTRIA_40: 0.05,
  FRANQUIAS: 0.16, RETENCAO: 0.07, CS_ENTERPRISE: 0.05,
  MARCA: 0.05, MIDIA_PERFORMANCE: 0.06, DADOS_BI: 0.03, PRODUTO: 0.05,
  LIDERANCA: 0.025, SUCESSAO: 0.06, TRIBUTARIO: 0.05,
  INTERNACIONAL: 0.12, ECOMMERCE: 0.06, TAKE_RATE: 0.08,
};

/** Um gargalo que trava um OKR crítico vale mais do que o mesmo gargalo solto. */
function multiplicadorRisco(u, comp) {
  const okr = (u.okrs || []).find((o) => (OKR_COMPETENCIA[o.titulo] || []).includes(comp));
  if (!okr) return 1;
  return { CRITICO: 1.4, ATRASADO: 1.2, NO_PRAZO: 1 }[riscoOkr(okr)];
}

/**
 * Probabilidade de realização. Um match de 45 e um de 90 não entregam o mesmo
 * valor esperado, e apresentar os dois como se entregassem é o tipo de número
 * que desmonta na primeira pergunta.
 */
function probabilidadeDeal(nota) { return 0.35 + 0.5 * (Math.min(100, nota) / 100); }

function valorDestravado(u, comps, nota) {
  const prob = probabilidadeDeal(nota);
  const linhas = comps.map((c) => {
    const bruto = (u.faturamento || 0) * (IMPACTO_COMPETENCIA[c] || 0.03) * multiplicadorRisco(u, c);
    return { comp: c, bruto, liquido: bruto * prob, risco: multiplicadorRisco(u, c) };
  });
  return { linhas, prob, total: linhas.reduce((s, l) => s + l.liquido, 0) };
}

/**
 * Sinergia operacional — proposital e diferente da nota de match.
 *
 * A nota ordena a fila; a sinergia responde outra pergunta: de tudo que estas
 * duas empresas declararam precisar, que fração esta dupla fecha? Para um
 * mentor, o "preciso" dele não entra na conta — ele está vendendo hora, não
 * buscando troca, e incluir isso puniria o par mais óbvio do ecossistema.
 */
function sinergiaOperacional(a, b, m) {
  const denominador = b.papel === 'MENTOR'
    ? a.preciso.length
    : a.preciso.length + b.preciso.length;
  const numerador = b.papel === 'MENTOR'
    ? m.cobertos.length
    : m.cobertos.length + m.devolvidos.length;
  const cobertura = denominador ? numerador / denominador : 0;
  const notaMedia = (m.total + calcularMatch(b, a).total) / 200;
  return {
    cobertura,
    valor: Math.round((0.6 * cobertura + 0.4 * notaMedia) * 100),
    numerador, denominador,
  };
}

/**
 * O outro lado também decide — mas não pelo mesmo critério.
 *
 * A primeira versão rodava a fórmula simétrica nos dois sentidos, e o
 * resultado era absurdo: Helena Prado, mentora de growth, pontuava 78 para
 * Marina e recusava com 38. A mentora cujo negócio inteiro é ser contratada
 * rejeitava a cliente ideal, porque a fórmula perguntava a ela "o que você
 * ganha de competência em troca?" — pergunta que não faz sentido para quem
 * vende hora.
 *
 * Então o aceite tem dois critérios, um por tipo de relação:
 *
 *  MENTOR  aceita quando cobre pelo menos um gargalo declarado e o cliente
 *          está dentro da faixa de faturamento que ele atende. É literalmente
 *          a qualificação comercial que um mentor faz na primeira conversa.
 *
 *  PAR     aceita pela nota inversa acima de 30. Entre pares não existe quem
 *          vende: a relação só se sustenta se os dois lados ganham, e a
 *          reciprocidade já pesa dentro dessa nota.
 */
function avaliarAceite(alvo, solicitante) {
  const nota = calcularMatch(alvo, solicitante);

  if (alvo.papel === 'MENTOR') {
    const cobre = interseccao(solicitante.preciso, alvo.tenho);
    const escala = fatorEscala(solicitante, alvo);
    const aceita = cobre.length >= 1 && escala >= 0.5;
    return {
      aceita, nota,
      criterio: 'qualificação de mentoria',
      motivo: aceita
        ? `cobre ${cobre.map((c) => COMP[c]).join(', ')} e ${brl(solicitante.faturamento)} cai dentro da faixa atendida`
        : cobre.length === 0
          ? 'não domina nenhum dos gargalos declarados'
          : `${brl(solicitante.faturamento)} está fora da faixa de ${brl(alvo.escalaAtendida[0])} a ${brl(alvo.escalaAtendida[1])}`,
    };
  }

  const aceita = nota.total >= 30;
  return {
    aceita, nota,
    criterio: 'reciprocidade entre pares',
    motivo: aceita
      ? `nota inversa ${nota.total} — ganha ${nota.cobertos.map((c) => COMP[c]).join(', ') || 'contexto de escala'} na troca`
      : motivoRecusa(nota),
  };
}
function decidir(aceitou) {
  const eu = porId(estado.usuarioAtivo);
  const item = estado.fila[estado.indiceFila];
  if (!item) return;
  const b = item.alvo;

  if (!aceitou) {
    estado.descartes.push({ de: eu.id, para: b.id });
    logIA('MATCH', `<b>${esc(eu.nome)}</b> passou de <b>${esc(b.nome)}</b>. O perfil sai da fila e os pesos não mudam — descarte não é sinal negativo de competência, só de momento.`);
    avancar();
    return;
  }

  const veredito = avaliarAceite(b, eu);
  const inverso = veredito.nota;
  logIA('MATCH', `Opt-in de <b>${esc(eu.nome)}</b> registrado. Avaliando <b>${esc(b.nome)}</b> por <b>${veredito.criterio}</b> — nota inversa <span class="val">${inverso.total}</span>.`, 'calculo');

  if (veredito.aceita) {
    const nda = gerarNda(eu, b, item.match);
    const conexao = { de: eu.id, para: b.id, match: item.match, inverso, nda, aberta: true };
    estado.conexoes.unshift(conexao);
    logIA('SALA', `Aceite de <b>${esc(b.nome)}</b>: ${veredito.motivo}. Sala aberta entre <b>${esc(eu.empresa)}</b> e <b>${esc(b.empresa)}</b> com NDA pré-assinado — objeto: ${item.match.cobertos.map((c) => COMP[c]).join(', ') || 'troca de contexto'}.`, 'decisao');
    avancar();
    abrirSalaDeGuerra(conexao);
    return;
  } else {
    logIA('MATCH', `<b>${esc(b.nome)}</b> recusou: ${veredito.motivo}. Nenhuma sala é aberta — dupla opt-in significa que um lado querendo não basta.`, 'calculo');
  }
  avancar();
}

function motivoRecusa(m) {
  const pior = [...m.componentes].sort((a, b) => a.valor - b.valor)[0];
  return `${pior.rotulo.toLowerCase()} em ${pct(pior.valor)} (${pior.desc})`;
}

function avancar() {
  estado.indiceFila += 1;
  const eu = porId(estado.usuarioAtivo);
  const atual = estado.fila[estado.indiceFila];
  document.getElementById('area-deck').innerHTML = atual ? cartaoDeck(eu, atual) : filaVazia();

    });
  });
}

/** O NDA cita a troca concreta e o OKR em risco. É o que separa um contrato
 *  gerado de um modelo preenchido. */
function gerarNda(a, b, m) {
  const risco = okrsEmRisco(a)[0];
  const objeto = m.cobertos.map((c) => COMP[c]).join(', ') || 'troca de contexto estratégico';
  const contrapartida = m.devolvidos.map((c) => COMP[c]).join(', ') || 'a definir entre as partes';
  const multa = Math.max(25_000, Math.round((a.faturamento || 1_000_000) * 0.004));
  const hoje = relogio.toLocaleDateString('pt-BR');

  return `INSTRUMENTO PARTICULAR DE CONFIDENCIALIDADE E NÃO ALICIAMENTO
Gerado automaticamente pela plataforma em ${hoje} · minuta sujeita a revisão jurídica

DAS PARTES

    com sede em ${a.cidade}, faturamento anual declarado de ${brl(a.faturamento)}.
II. ${b.empresa} ("Parte Contribuinte"), representada por ${b.nome}, ${b.cargo},
    com sede em ${b.cidade}${b.faturamento ? `, faturamento anual declarado de ${brl(b.faturamento)}` : ', atuação em mentoria executiva'}.

CLÁUSULA 1 — DO OBJETO
As Partes abrem canal de negociação para troca estruturada de competências,
especificamente: ${objeto}.
Como contrapartida, a Parte Demandante disponibiliza: ${contrapartida}.

CLÁUSULA 2 — DO CONTEXTO DECLARADO
A Parte Demandante declara que a troca visa destravar o seguinte resultado-chave:
"${risco ? risco.titulo : a.okrs[0].titulo}"
métrica: ${risco ? risco.metrica : a.okrs[0].metrica} · prazo remanescente: ${risco ? risco.prazoDias : a.okrs[0].prazoDias} dias
situação atual: ${risco ? OKR_ROTULO[riscoOkr(risco)] : 'no prazo'}, com ${risco ? risco.progresso : a.okrs[0].progresso}% de progresso.

CLÁUSULA 3 — DA CONFIDENCIALIDADE
Toda informação trocada neste canal — números de faturamento, margem, carteira de
clientes, estrutura societária, metas e documentos anexados — é confidencial pelo
prazo de 24 (vinte e quatro) meses contados desta data, sobrevivendo ao término
da negociação, independentemente do motivo.

CLÁUSULA 4 — DA NÃO CIRCUNVENÇÃO
As Partes não abordarão diretamente clientes, fornecedores ou colaboradores
identificados exclusivamente em razão desta negociação, pelo mesmo prazo da
Cláusula 3, sem anuência escrita da outra Parte.

CLÁUSULA 5 — DA MULTA
O descumprimento das Cláusulas 3 ou 4 sujeita a Parte infratora a multa não
compensatória de ${brl(multa)}, equivalente a 0,4% do faturamento anual declarado

CLÁUSULA 6 — DA SUPERVISÃO DA PLATAFORMA

${a.nome}                              ${b.nome}

}

/* ============================================================================
   MÓDULO 3 — SALA DE GUERRA COMERCIAL
   Dispara no match. Três coisas na tela, nesta ordem, porque é a ordem em que
   um CEO decide: quanto os dois se encaixam, quanto isso vale, e o que ele
   assina agora para começar. O NDA fica ao lado do número de propósito — o
   argumento do produto é que a burocracia deixa de ser o gargalo entre a
   vontade e o começo.
   ========================================================================== */

/** Hash curto e determinístico só para dar aparência de protocolo à assinatura simulada. */
function protocolo(txt) {
  let h = 0x811c9dc5;
  for (let i = 0; i < txt.length; i++) { h ^= txt.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0').toUpperCase();
}

/** Arco do medidor de sinergia, calculado — não é caminho SVG escrito à mão. */
function arcoMedidor(pctValor) {
  const R = 62, cx = 74, cy = 74;
  const ang = Math.PI * (pctValor / 100);
  const x = cx - R * Math.cos(ang);
  const y = cy - R * Math.sin(ang);
  const grande = pctValor > 50 ? 1 : 0;
  return `M ${cx - R} ${cy} A ${R} ${R} 0 ${grande} 1 ${x.toFixed(2)} ${y.toFixed(2)}`;
}

/** A contraparte de um deal patrocinado não está na população — ela vem do anúncio. */
function parteDestino(conexao) {
  return conexao.contraparteExterna || porId(conexao.para);
}

function abrirSalaDeGuerra(conexao) {
  const a = porId(conexao.de), b = parteDestino(conexao);
  const sin = sinergiaOperacional(a, b, conexao.match);
  // Três formas de gerar valor, porque são três relações diferentes. Somar as
  // competências dos dois lados só faz sentido entre pares: um mentor fatura
  // hora, e um anunciante põe na mesa o aporte ou o contrato que anunciou.
  const vA = conexao.patrocinado
    ? { linhas: [], prob: probabilidadeDeal(conexao.match.total),
        total: conexao.patrocinado.valorOfertado * probabilidadeDeal(conexao.match.total) }
    : valorDestravado(a, conexao.match.cobertos, conexao.match.total);
  // No deal patrocinado, a base do anunciante é o tamanho da empreitada, não o
  // faturamento inteiro da holding: uma joint-venture de R$ 12M não move os
  // R$ 480M do grupo, e projetar sobre a base cheia produz um número grande e
  // indefensável — exatamente o tipo que desmonta na primeira pergunta.
  const baseB = conexao.patrocinado
    ? { ...b, faturamento: Math.min(b.faturamento, conexao.patrocinado.valorOfertado * 3) }
    : b;
  const vB = b.papel === 'MENTOR'
    ? { linhas: [], prob: 0, total: b.hora * 1.5 * 24 }
    : valorDestravado(baseB, conexao.patrocinado ? conexao.patrocinado.competencias : conexao.match.devolvidos,
        conexao.inverso.total);
  const combinado = vA.total + vB.total;

  const caixa = document.getElementById('guerra-caixa');
  caixa.innerHTML = `
    <div class="guerra-faixa">
      <div style="flex:1;min-width:260px">

        <h2 style="font-family:var(--fonte-display);font-size:26px;font-weight:400;margin-top:6px">
          ${esc(a.empresa)} <span style="color:var(--ouro)">⇄</span> ${esc(b.empresa)}
        </h2>
        <p style="margin:5px 0 0;font-size:13px;color:var(--neutro)">
          ${esc(a.nome)}, ${esc(a.cargo)} · ${esc(b.nome)}, ${esc(b.cargo)}
        </p>
      </div>
      <button class="btn" id="fechar-guerra">Fechar</button>
    </div>

    <div class="guerra-corpo">
      <div class="guerra-secao">
        <div class="medidor">
          <svg width="148" height="86" viewBox="0 0 148 86" aria-hidden="true">
            <path d="M 12 74 A 62 62 0 0 1 136 74" fill="none" stroke="#1E4362" stroke-width="11" stroke-linecap="round"/>
            <path d="${arcoMedidor(sin.valor)}" fill="none" stroke="#C9A46B" stroke-width="11" stroke-linecap="round"/>
          </svg>
          <div>
            <span class="rotulo-peq">Sinergia operacional</span>
            <div class="contador" id="contador-sinergia" data-alvo="${sin.valor}">0%</div>
            <p style="font-size:13px;color:var(--neutro);margin:6px 0 0;max-width:44ch">
              Das <b>${sin.denominador}</b> lacunas declaradas entre as duas empresas, esta dupla fecha <b>${sin.numerador}</b>.
              A nota do match entra com 40% de peso — cobertura sem probabilidade de acontecer não é sinergia.
            </p>
          </div>
          <div style="margin-left:auto;text-align:right;min-width:210px">
            <span class="rotulo-peq">Geração de valor combinada · 12 meses</span>
            <div class="num-tese" style="color:var(--ouro);margin-top:6px">${brl(combinado)}</div>
            <p style="font-size:12px;color:var(--neutro-fraco);margin:5px 0 0">
              já descontada a probabilidade de realização de ${pct(vA.prob)}
            </p>
          </div>
        </div>
      </div>

      <div class="guerra-secao">
        <span class="rotulo-peq">De onde sai o número — linha a linha</span>
        <div class="rolagem" style="margin-top:10px">
          <table>
            <thead><tr><th>Para quem</th><th>Competência destravada</th><th>Base</th><th>Risco do OKR</th><th style="text-align:right">Valor esperado</th></tr></thead>
            <tbody>
              ${vA.linhas.map((l) => `<tr>
                <td>${esc(a.empresa)}</td>
                <td>${COMP[l.comp]}</td>
                <td class="n">${pct(IMPACTO_COMPETENCIA[l.comp] || 0.03, 1)} de ${brl(a.faturamento)}</td>
                <td class="n">×${l.risco.toFixed(2)}</td>
                <td class="n" style="text-align:right">${brl(l.liquido)}</td>
              </tr>`).join('')}
              ${vB.linhas.map((l) => `<tr>
                <td>${esc(b.empresa)}</td>
                <td>${COMP[l.comp]}</td>
                <td class="n">${pct(IMPACTO_COMPETENCIA[l.comp] || 0.03, 1)} de ${brl(baseB.faturamento)}${conexao.patrocinado ? ' <span style="color:var(--neutro-fraco)">(escala da empreitada)</span>' : ''}</td>
                <td class="n">×${l.risco.toFixed(2)}</td>
                <td class="n" style="text-align:right">${brl(l.liquido)}</td>
              </tr>`).join('')}
              ${b.papel === 'MENTOR' ? `<tr>
                <td>${esc(b.empresa)}</td>
                <td>Receita de mentoria contratada</td>
                <td class="n">${brlCent(b.hora)}/h · 24 sessões de 90 min</td>
                <td class="n">—</td>
                <td class="n" style="text-align:right">${brl(vB.total)}</td>
              </tr>` : ''}
              ${conexao.patrocinado ? `<tr>
                <td>${esc(a.empresa)}</td>
                <td>Oferta anunciada — ${esc(conexao.patrocinado.oferta)}</td>

            </tbody>
          </table>
        </div>
        ${!vA.linhas.length && !vB.linhas.length && b.papel !== 'MENTOR'
          ? '<p class="lista-vazia" style="margin-top:8px">Nenhuma competência trocada — este deal vale pela escala e pelo setor, não por lacuna fechada.</p>' : ''}
      </div>

      <div class="guerra-secao">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
          <span class="rotulo-peq">Painel de documentos · NDA pré-preenchido</span>
          <span id="status-nda" class="selo">aguardando as duas assinaturas</span>
        </div>
        <div class="doc" style="margin-top:10px;max-height:240px">${esc(conexao.nda)}</div>

        <div class="grade g2" style="margin-top:14px">
          ${[[a, 'a'], [b, 'b']].map(([p, k]) => `
            <div class="assinatura" id="assin-${k}">
              <div>
                <span class="rotulo-peq">Assinatura digital simulada</span>
                <div style="font-weight:650;font-size:14.5px;margin-top:3px">${esc(p.nome)}</div>
                <div style="font-size:12.5px;color:var(--neutro)">${esc(p.cargo)} · ${esc(p.empresa)}</div>
              </div>
              <button class="btn btn-ouro btn-peq" data-assinar="${k}">Assinar como ${esc(p.nome.split(' ')[0])}</button>
              <div class="hash" id="hash-${k}"></div>
            </div>`).join('')}
        </div>
        <p style="font-size:11.5px;color:var(--neutro-fraco);margin:11px 0 0">
          Minuta gerada por software e assinatura simulada — em produção, o aceite passa por certificado e revisão jurídica antes de vincular as partes.
        </p>
      </div>
    </div>`;

  document.getElementById('guerra').classList.add('aberta');
  document.getElementById('fechar-guerra').addEventListener('click', fecharSalaDeGuerra);

  const assinadas = { a: false, b: false };
  caixa.querySelectorAll('[data-assinar]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.assinar;
      const p = k === 'a' ? a : b;
      assinadas[k] = true;
      const bloco = document.getElementById(`assin-${k}`);
      bloco.classList.add('assinado');
      btn.disabled = true;
      btn.textContent = 'Assinado';
      btn.classList.remove('btn-ouro');
      const carimbo = relogio.toLocaleString('pt-BR');
      document.getElementById(`hash-${k}`).textContent =
        `protocolo ${protocolo(conexao.nda + p.nome)} · ${carimbo}`;
      logIA('NDA', `<b>${esc(p.nome)}</b> assinou o NDA de ${esc(a.empresa)} ⇄ ${esc(b.empresa)}.`, 'decisao');
      if (assinadas.a && assinadas.b) {
        const s = document.getElementById('status-nda');
        s.textContent = 'NDA vigente — sala liberada para números';
        s.className = 'selo casa';
        logIA('NDA', `Duas assinaturas registradas. O canal entre <b>${esc(a.empresa)}</b> e <b>${esc(b.empresa)}</b> passa a permitir troca de números — <b>tempo do match ao contrato vigente: menos de um minuto</b>.`, 'decisao');
      }
    });
  });

  // O contador sobe de 0 até a sinergia: é o gesto que faz a sala parecer uma
  // sala, e não um cartão que apareceu pronto.
  const alvoNum = sin.valor;
  const el = document.getElementById('contador-sinergia');
  const reduzido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduzido) { el.textContent = `${alvoNum}%`; }
  else {
    let n = 0;
    const passo = () => {
      n = Math.min(alvoNum, n + Math.max(1, Math.round(alvoNum / 28)));
      el.textContent = `${n}%`;
      if (n < alvoNum) requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
  }

  logIA('SALA DE GUERRA', `Sinergia operacional <span class="val">${sin.valor}%</span> (${sin.numerador} de ${sin.denominador} lacunas fechadas). Valor combinado projetado <span class="val">${brl(combinado)}</span> em 12 meses, com probabilidade de realização de <span class="val">${pct(vA.prob)}</span> derivada da nota do match.`, 'calculo');
}

function fecharSalaDeGuerra() {
  document.getElementById('guerra').classList.remove('aberta');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('guerra').classList.contains('aberta')) fecharSalaDeGuerra();
});

/**
 * Quem responde do outro lado quando alguém aceita a demanda, e quanto vale a
 * oferta anunciada. Fica separado do anúncio porque são coisas diferentes: o
 * card é peça de mídia, isto é a contraparte real que entra na sala.
 */
const CONTRAPARTE_AD = {
  ad1: { nome: 'Vera Nakamura', cargo: 'Diretora de novos negócios', setor: 'INDUSTRIA', faturamento: 480_000_000, valorOfertado: 12_000_000 },
  ad2: { nome: 'Sérgio Bianchi', cargo: 'Diretor de operações', setor: 'VAREJO', faturamento: 310_000_000, valorOfertado: 7_400_000 },
  ad3: { nome: 'Alice Fontenele', cargo: 'Head de originação', setor: 'SAAS', faturamento: 900_000_000, valorOfertado: 18_000_000 },
  ad4: { nome: 'Marcelo Aguiar', cargo: 'Sócio de expansão', setor: 'ALIMENTACAO', faturamento: 95_000_000, valorOfertado: 5_600_000 },
  ad5: { nome: 'Renan Cioffi', cargo: 'Managing partner', setor: 'INDUSTRIA', faturamento: 200_000_000, valorOfertado: 26_000_000 },
};

function contraparteDoAnuncio(ad) {
  const c = CONTRAPARTE_AD[ad.id];
  return {
    id: `ad:${ad.id}`, nome: c.nome, cargo: c.cargo, empresa: ad.anunciante,
    setor: c.setor, faturamento: c.faturamento, funcionarios: 0,
    cidade: 'São Paulo', papel: 'EXECUTIVO', resumo: ad.demanda,
    tenho: [], preciso: ad.exige, formacao: [], okrs: [],
  };
}

/** Um anúncio só aparece para quem passa nos três filtros que o anunciante comprou. */
function elegibilidadeAd(ad, u) {
  const porFaturamento = u.faturamento >= ad.faturamentoMinimo;
  const porSetor = ad.setoresAlvo.includes(u.setor);
  const competenciasCasadas = interseccao(ad.exige, u.tenho);
  const porCompetencia = competenciasCasadas.length > 0;
  return {
    elegivel: porFaturamento && porSetor && porCompetencia,
    porFaturamento, porSetor, competenciasCasadas,
    motivo: [
      porFaturamento
        ? `faturamento de ${brl(u.faturamento)} acima do mínimo de ${brl(ad.faturamentoMinimo)}`
        : `faturamento abaixo do mínimo de ${brl(ad.faturamentoMinimo)}`,
      porSetor ? `setor ${SETOR[u.setor]} está no alvo` : `setor ${SETOR[u.setor]} fora do alvo`,
      porCompetencia
        ? `você declara ${competenciasCasadas.map((c) => COMP[c]).join(', ')}`
        : `nenhuma das competências exigidas (${ad.exige.map((c) => COMP[c]).join(', ')})`,
    ],
  };
}

function adsPara(u) {
  return ANUNCIOS.map((ad) => ({ ad, el: elegibilidadeAd(ad, u) })).filter((x) => x.el.elegivel);
}

/** O que este inventário fatura — a pergunta que o investidor faz em seguida. */
function receitaDeMidia() {
  const alcance = ANUNCIOS.map((ad) => ({
    ad,
    alcancados: USUARIOS.filter((u) => u.papel !== 'MENTOR' && elegibilidadeAd(ad, u).elegivel).length,
  }));
  const mensal = ANUNCIOS.reduce((s, a) => s + a.investimentoMensal, 0);
  const impressoes = alcance.reduce((s, a) => s + a.alcancados, 0);
  return { alcance, mensal, impressoes };
}

function insightsPara(u) {
  return EVENTOS_MACRO
    .filter((e) => e.setores.includes(u.setor))
    .map((e) => ({ evento: e, resultado: e.impacto(u) }))
    .sort((a, b) => b.resultado.numero - a.resultado.numero);
}

/**
 * Aceitar uma demanda patrocinada é um match como outro qualquer — o que muda
 * é que o anunciante já pagou para declarar o interesse, então não há segundo
 * opt-in a esperar. Vai direto para a sala.
 */
function aceitarDemandaPatrocinada({ ad, el }) {
  const u = porId(estado.usuarioAtivo);
  const contraparte = contraparteDoAnuncio(ad);
  const match = calcularMatch(u, contraparte);
  const inverso = calcularMatch(contraparte, u);
  const nda = gerarNda(u, contraparte, match);

  const conexao = {
    de: u.id, para: contraparte.id, match, inverso, nda, aberta: true,
    patrocinado: { ad, competencias: el.competenciasCasadas, valorOfertado: CONTRAPARTE_AD[ad.id].valorOfertado, oferta: ad.oferta },
    contraparteExterna: contraparte,
  };
  estado.conexoes.unshift(conexao);

  logIA('ADS', `<b>${esc(u.empresa)}</b> aceitou a demanda patrocinada de <b>${esc(ad.anunciante)}</b>. Lead qualificado entregue ao anunciante por <span class="val">${brl(ad.cpl)}</span> — o filtro de ${brl(ad.faturamentoMinimo)} e de competência já foi aplicado antes do card aparecer.`, 'decisao');
  abrirSalaDeGuerra(conexao);
}

/**
 * Interpreta a condição digitada em linguagem natural.
 *
 * A direção não pode ter um default único. "Se o faturamento cair" e "se
 * houver mudança de controle" são frases de formato diferente: a primeira
 * nomeia o movimento, a segunda só nomeia o evento — não existe "controle
 * caindo". Assumir queda para todos fazia as cláusulas de controle, de SLA e
 * de inadimplência nunca dispararem, e o relatório saía zerado justamente nos
 * cenários mais graves. O default passa a vir do tipo.
 */
const DIRECAO_PADRAO = {
  faturamento: 'queda',   // o cenário de risco de receita é a queda
  atraso: 'alta',         // atraso e indisponibilidade só existem subindo
  inadimplencia: 'alta',
  controle: 'alta',       // o evento ocorrendo, não uma grandeza variando
};

function interpretarCondicao(txt) {
  const t = txt.toLowerCase();
  let direcao = null;
  if (/\b(cair|queda|cai|redu|diminu|perde|baix)/.test(t)) direcao = 'queda';
  if (/\b(subir|sobe|alta|aument|cresc|dobr)/.test(t)) direcao = 'alta';

  let tipo = null;
  if (/controle|vender a empresa|s[óo]cio|aquisi|comprad|fus[ãa]o/.test(t)) tipo = 'controle';
  else if (/inadimpl|calote|n[ãa]o pag/.test(t)) tipo = 'inadimplencia';
  else if (/atras|prazo|entrega|indisponib|sla|fora do ar|queda de servi/.test(t)) tipo = 'atraso';
  else if (/fatur|receita|venda|billing|arr|mrr|d[óo]lar|c[âa]mbio|moeda/.test(t)) tipo = 'faturamento';

  const m = t.match(/(\d+(?:[.,]\d+)?)\s*%/);
  const magnitude = m ? parseFloat(m[1].replace(',', '.')) / 100 : 0.20;

  const tipoFinal = tipo || 'faturamento';
  return {
    tipo: tipoFinal,
    direcao: direcao || DIRECAO_PADRAO[tipoFinal],
    magnitude,
    original: txt,
  };
}

function analisarContrato() {
  const u = porId(estado.usuarioAtivo);
  const doc = DOCUMENTOS.find((x) => x.id === document.getElementById('sel-doc').value);
  const cond = interpretarCondicao(document.getElementById('in-condicao').value);

  logIA('CONTRATO', `Condição interpretada: tipo <b>${cond.tipo}</b>, direção <b>${cond.direcao}</b>, magnitude <span class="val">${pct(cond.magnitude)}</span>. Confrontando ${doc.clausulas.length} cláusulas de "${esc(doc.nome)}".`, 'calculo');

  const avaliadas = doc.clausulas.map((c) => {
    const casaTipo = c.gatilho.tipo === cond.tipo;
    const casaDirecao = c.gatilho.direcao === cond.direcao;
    const disparou = casaTipo && casaDirecao && cond.magnitude >= c.gatilho.limiar;
    const excedente = disparou ? (cond.magnitude - c.gatilho.limiar) / Math.max(0.01, c.gatilho.limiar) : 0;

    let nivel = 'verde';
    if (disparou) nivel = excedente > 1.0 ? 'vermelho' : excedente > 0.25 ? 'amarelo' : 'amarelo';
    if (disparou && c.gatilho.limiar >= 0.20) nivel = 'vermelho';
    if (!disparou && casaTipo && casaDirecao && cond.magnitude >= c.gatilho.limiar * 0.7) nivel = 'amarelo';

    const valor = disparou ? Math.round(c.exposicao(u, cond.magnitude)) : 0;
    return { c, disparou, nivel, valor, excedente };
  }).sort((a, b) => b.valor - a.valor);

  const total = avaliadas.reduce((s, a) => s + a.valor, 0);
  const vermelhas = avaliadas.filter((a) => a.nivel === 'vermelho').length;
  const ebitdaEstimado = u.faturamento * 0.13;

  const NIVEL_TXT = { verde: 'Verde — não dispara', amarelo: 'Amarelo — dispara com folga estreita', vermelho: 'Vermelho — dispara com folga larga' };

  document.getElementById('saida-contrato').innerHTML = `

      <span class="rotulo-peq">Exposição no cenário "${esc(cond.original)}"</span>
      <div class="num-tese" style="margin-top:6px;color:${total > ebitdaEstimado ? 'var(--vermelho)' : 'var(--ouro)'}">${brl(total)}</div>
      <p style="color:var(--neutro);font-size:13px;margin:7px 0 0">
        ${pct(total / u.faturamento, 1)} do faturamento de ${esc(u.empresa)} ·
        <b style="color:${total > ebitdaEstimado ? 'var(--vermelho)' : 'var(--creme)'}">${pct(total / ebitdaEstimado, 0)} do EBITDA estimado</b> ·
        ${vermelhas} cláusula${vermelhas === 1 ? '' : 's'} em vermelho
      </p>
      ${total > ebitdaEstimado ? `<p style="font-size:13px;color:var(--vermelho);margin:9px 0 0"><b>A exposição supera o resultado do ano.</b> Neste cenário o contrato não reduz lucro — consome o resultado inteiro e entra no capital de giro.</p>` : ''}
    </div>

    <div style="margin-top:var(--gap);display:grid;gap:12px">
      ${avaliadas.map((a) => `
        <article class="cartao" style="border-left:3px solid var(--${a.nivel === 'verde' ? 'verde' : a.nivel === 'amarelo' ? 'amarelo' : 'vermelho'})">
          <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
            <div style="flex:1;min-width:200px">
              <span class="semaforo v-${a.nivel}"><span class="ponto"></span>${NIVEL_TXT[a.nivel]}</span>
              <h3 style="font-size:15.5px;font-weight:650;margin:6px 0 0">Cláusula ${a.c.id} — ${esc(a.c.titulo)}</h3>
            </div>
            <div style="text-align:right">
              <div style="font-family:var(--fonte-dado);font-size:17px;font-variant-numeric:tabular-nums">${a.valor ? brl(a.valor) : '—'}</div>
              <span class="rotulo-peq">exposição</span>
            </div>
          </div>
          <p style="font-size:13px;color:var(--neutro);margin:11px 0 0">${a.c.analise(u, cond.magnitude)}</p>
          <p style="font-size:11.5px;color:var(--neutro-fraco);margin:8px 0 0;font-family:var(--fonte-dado)">
            gatilho: ${a.c.gatilho.tipo} · ${a.c.gatilho.direcao} · limiar ${pct(a.c.gatilho.limiar)} ·
            cenário ${pct(cond.magnitude)} → ${a.disparou ? `excede em ${pct(a.excedente, 0)}` : 'não atinge'}
          </p>
        </article>`).join('')}
    </div>`;

  logIA('CONTRATO', `Relatório fechado: <span class="val">${brl(total)}</span> de exposição, <b>${pct(total / ebitdaEstimado, 0)} do EBITDA estimado</b>. ${vermelhas ? `Cláusula mais grave: <b>${esc(avaliadas[0].c.titulo)}</b> (${brl(avaliadas[0].valor)}).` : 'Nenhuma cláusula em vermelho neste cenário.'}`, 'decisao');
}

/**
 * A ordem "de prateleira": alfabética, igual para todo mundo.
 *
 * É o contraste que o módulo existe para mostrar. Um catálogo neutro não sabe
 * qual é o seu gargalo — e é exatamente por isso que a maioria das trilhas de
 * micro-learning é abandonada na terceira aula.
 */
const CATALOGO_PADRAO = [...CATALOGO].sort((a, b) => a.titulo.localeCompare(b.titulo, 'pt-BR'));

const PESO_RISCO = { CRITICO: 3, ATRASADO: 2, NO_PRAZO: 0.5 };

function prioridadeTrilha(u) {
  const demanda = new Map();
  (u.okrs || []).forEach((o) => {
    const risco = riscoOkr(o);
    (OKR_COMPETENCIA[o.titulo] || []).forEach((c) => {
      demanda.set(c, Math.max(demanda.get(c) || 0, PESO_RISCO[risco]));
    });
  });

  return CATALOGO.map((m) => {
    const puxadoPorOkr = Math.max(0, ...m.comp.map((c) => demanda.get(c) || 0));
    const lacuna = m.comp.some((c) => u.preciso.includes(c)) ? 2 : 0;
    const jaTem = m.comp.every((c) => u.tenho.includes(c)) ? -2.5 : 0;
    const score = puxadoPorOkr * 2 + lacuna + jaTem;
    const okrOrigem = (u.okrs || []).find((o) => (OKR_COMPETENCIA[o.titulo] || []).some((c) => m.comp.includes(c)));
    return { m, score, puxadoPorOkr, lacuna, jaTem, okrOrigem };
  }).sort((a, b) => b.score - a.score || a.m.min - b.m.min);
}

  { id: 'm-match',     tit: 'Match e sala de guerra', des: 'a conta que decide + o deal aberto' },
  { id: 'm-feed',      tit: 'Feed e demanda patrocinada', des: 'macro em reais + o inventário que fatura' },
  { id: 'm-contratos', tit: 'Contratos condicionais', des: 'semáforo e exposição em reais' },
  { id: 'm-lxp',       tit: 'Trilha e mentoria híbrida', des: 'reordena quando o OKR atrasa' },
];

const trilho = document.getElementById('trilho');
MODULOS.forEach((m, i) => {
  const b = document.createElement('button');
  b.className = 'aba';
  b.setAttribute('aria-current', i === 0 ? 'true' : 'false');
  b.dataset.alvo = m.id;
  b.innerHTML = `<span class="num">0${i + 1}</span><span><span class="tit">${m.tit}</span><span class="des">${m.des}</span></span>`;
  b.addEventListener('click', () => irPara(m.id));
  trilho.appendChild(b);
});

function irPara(id) {
  document.querySelectorAll('.modulo').forEach((s) => s.classList.toggle('ativo', s.id === id));
  document.querySelectorAll('.aba').forEach((a) => a.setAttribute('aria-current', String(a.dataset.alvo === id)));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.addEventListener('keydown', (e) => {
  const deckAberto = document.getElementById('m-match').classList.contains('ativo');
  if (!deckAberto || !document.getElementById('btn-sim')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); decidir(true); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); decidir(false); }
});

/** Roteiro guiado: um clique percorre os cinco módulos disparando uma ação
 *  real em cada um, com o console narrando. É o modo de apresentar sem
 *  precisar lembrar por onde começar. */
let roteiroRodando = false;
document.getElementById('btn-roteiro').addEventListener('click', async () => {
  if (roteiroRodando) return;
  roteiroRodando = true;
  const btn = document.getElementById('btn-roteiro');
  btn.textContent = '● Rodando…';
  const espera = (ms) => new Promise((r) => setTimeout(r, ms));

  irPara('m-populacao');
  logIA('PITCH', 'Passo 1 — a população. 16 empresas com OKR datado, gargalo declarado e faturamento. Sem isto, nenhum dos módulos seguintes tem o que cruzar.', 'decisao');
  await espera(2600);

  irPara('m-match');
  logIA('PITCH', 'Passo 2 — o match. Repare que a nota vem decomposta em cinco componentes: é defensável na frente de quem for perguntar por que estes dois.', 'decisao');
  await espera(2400);
  decidir(true);
  await espera(1400);
  logIA('PITCH', 'Passo 3 — a sala de guerra. Sinergia, valor combinado com a conta aberta, e o NDA já preenchido com os nomes e o OKR em jogo. Do match ao contrato assinado sem sair da tela.', 'decisao');
  await espera(3400);

  fecharSalaDeGuerra();
  irPara('m-feed');
  logIA('PITCH', 'Passo 4 — o feed. O mesmo fato macro vale um número diferente para cada empresa, porque é aplicado ao faturamento e ao ciclo de caixa dela. E no topo dele fica o inventário que fatura: demanda patrocinada, vendida por filtro de faturamento e competência.', 'decisao');
  await espera(2600);
  const primeiroPlano = document.querySelector('[data-plano]');
  if (primeiroPlano) primeiroPlano.click();
  await espera(2200);

  irPara('m-contratos');
  logIA('PITCH', 'Passo 4 — o contrato. Aqui está a parte que ninguém consegue improvisar num pitch: a exposição sai em reais e comparada ao EBITDA.', 'decisao');
  await espera(2200);
  analisarContrato();
  await espera(2400);

  irPara('m-lxp');
  logIA('PITCH', 'Passo 5 — a trilha. É o que fecha o ciclo: o OKR atrasado reordena o aprendizado, e o aprendizado volta para o OKR.', 'decisao');
  await espera(1800);
  const reord = document.getElementById('btn-reordenar');
  if (reord && !estado.trilhaReordenada) reord.click();

  btn.textContent = '▶ Roteiro de pitch';
  roteiroRodando = false;
});

document.getElementById('btn-reset').addEventListener('click', () => {
  estado.conexoes = [];
  estado.descartes = [];
  estado.trilhaReordenada = false;
  montarFila();
  renderTudo();
  logIA('SISTEMA', 'Simulação reiniciada. Salas fechadas, fila recomposta, trilha de volta à ordem padrão.');
});

function renderTudo() {
  renderPopulacao();
  renderMatch();
  renderFeed();
  renderContratos();
  renderLxp();
  ligarBotoesSala();
}

/* Arranque */
logIA('SISTEMA', 'Motor iniciado. <b>16 perfis</b> carregados em memória, <b>26 competências</b> no vocabulário controlado, <b>5 eventos macro</b> monitorados, <b>3 documentos</b> indexados por gatilho.');
montarFila();
renderTudo();
logIA('SISTEMA', `${USUARIOS.flatMap((u) => okrsEmRisco(u)).length} OKRs fora do prazo detectados na população — é esta lista que alimenta a priorização do match e da trilha.`, 'calculo');
</script>
