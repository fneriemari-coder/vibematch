name: Publicar protótipo

# Publica APENAS demo/tracao-continua.html como o site do GitHub Pages.
# O artefato enviado contém um único arquivo, então nada mais do repositório
# passa a ser servido — o backend e o app continuam fora do ar público.

on:
  push:
    branches: [main]
    paths:
      - 'demo/tracao-continua.html'
      - '.github/workflows/publicar-prototipo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site com um arquivo só
        run: |
          mkdir -p site
          cp demo/tracao-continua.html site/index.html
          ls -l site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
