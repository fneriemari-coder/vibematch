name: Deploy Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: matchservice-app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter pub get

      # Points at the live Railway deployment. Override per-environment by
      # setting an API_BASE_URL repository variable — that wins over the
      # default below without touching this file.
      # The API must keep this Pages origin in its CORS_ORIGIN allowlist
      # (https://fneriemari-coder.github.io), or the browser blocks every
      # request even though the API itself is healthy.
      # FIREBASE_VAPID_KEY is the Web Push public key from
      # Firebase console -> Cloud Messaging -> Certificados push da Web.
      # It is a public key, so a repository *variable* is the right home for
      # it — not a secret. While unset, the app skips web push token
      # registration instead of failing on boot.
      - name: flutter build web
        run: >
          flutter build web --release
          --base-href /vibematch/
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://vibematch-production-ea5b.up.railway.app' }}
          --dart-define=FIREBASE_VAPID_KEY=${{ vars.FIREBASE_VAPID_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: matchservice-app/build/web

      - id: deployment
        uses: actions/deploy-pages@v4
