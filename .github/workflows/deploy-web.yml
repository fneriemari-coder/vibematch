name: Publish to GitHub Pages

# One workflow, one artifact, one deployment. There used to be two —
# deploy-web.yml on every push and publicar-prototipo.yml on demo changes —
# both writing to the same Pages site under the same `pages` concurrency
# group. Whichever finished last won, so the site's content depended on which
# files a commit happened to touch: the merge of #1 touched neither the demo
# nor its workflow, so only the Flutter job ran and the prototype published
# minutes earlier was overwritten. Both artifacts now ship together:
#
#   /vibematch/       → demo/tracao-continua.html, the pitch prototype
#   /vibematch/app/   → the Flutter web build
#
# Neither can displace the other, and the URLs no longer depend on which
# paths a commit touched.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: flutter pub get
        working-directory: matchservice-app
        run: flutter pub get

      # Points at the live Railway deployment. Override per-environment by
      # setting an API_BASE_URL repository variable — that wins over the
      # default below without touching this file.
      # The API must keep this Pages origin in its CORS_ORIGIN allowlist
      # (https://fneriemari-coder.github.io), or the browser blocks every
      # request even though the API itself is healthy.
      # The Web Push VAPID key is a public key and lives in
      # lib/firebase_options.dart with the rest of the client config. It is
      # deliberately NOT passed as a --dart-define here: an unset repository
      # variable expands to an empty string, and String.fromEnvironment treats
      # an explicitly-empty value as set — which would silently override the
      # real key with nothing and disable web push.
      # base-href gained the /app/ segment when the prototype took the root.
      - name: flutter build web
        working-directory: matchservice-app
        run: >
          flutter build web --release
          --base-href /vibematch/app/
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://vibematch-production-ea5b.up.railway.app' }}

      - name: Assemble the site
        run: |
          mkdir -p site/app
          cp demo/tracao-continua.html site/index.html
          cp -r matchservice-app/build/web/. site/app/
          test -s site/index.html
          test -s site/app/index.html
          echo "--- site/ ---" && ls site && echo "--- site/app/ ---" && ls site/app | head

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
